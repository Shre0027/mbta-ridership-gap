name: Monthly data refresh

on:
  schedule:
    - cron: "17 14 8 * *"   # 8th of each month, after OPMI's monthly update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, analyze, build
        run: |
          python scripts/01_fetch.py
          python scripts/02_analyze.py
          python scripts/04_system.py
          python scripts/05_geo.py
          python scripts/06_trains.py
          python scripts/07_fix.py
          python scripts/08_bus.py
          python scripts/09_preview.py
          python scripts/10_disruptions.py
          python scripts/03_build_page.py
      - name: Check outputs before publishing
        run: python tests/check_outputs.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add outputs index.html trains.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Monthly data refresh" && git push; fi
